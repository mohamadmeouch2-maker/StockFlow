<!doctype html>
<!-- Shown by sw.js when StockFlow can't be reached. It has everything inside (no other files),
     because nothing else can load at that moment. Language and dark mode as the user chose them. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StockFlow</title>
    <style>
      :root {
        --page: #f8fafc;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #64748b;
        --border: #e2e8f0;
        color-scheme: light;
      }
      :root.dark {
        --page: #0b1120;
        --card: #11192a;
        --text: #f1f5f9;
        --muted: #94a3b8;
        --border: #263043;
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        box-sizing: border-box;
        background: var(--page);
        color: var(--text);
        font-family: system-ui, "Segoe UI", sans-serif;
      }
      main {
        max-width: 380px;
        padding: 32px 24px;
        text-align: center;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
      }
      h1 {
        margin: 16px 0 8px;
        font-size: 22px;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
        line-height: 1.5;
      }
      button {
        padding: 10px 20px;
        border: 0;
        border-radius: 8px;
        background: #2563eb;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 64 64" width="64" height="64" aria-hidden="true">
        <rect width="64" height="64" rx="14" fill="#2563eb" />
        <g fill="none" stroke="#fff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
          <path d="M18 24 32 17l14 7v16l-14 7-14-7Z" />
          <path d="m18 24 14 7 14-7M32 31v16" />
        </g>
      </svg>
      <h1 id="title">StockFlow can't be reached</h1>
      <p id="text">The website's server is off, or there is no internet. Try again in a moment.</p>
      <button id="retry" type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      // The language and the mode the user chose in StockFlow (saved in this browser)
      var texts = {
        ar: ["تعذّر الوصول إلى StockFlow", "خادم الموقع متوقف، أو لا يوجد إنترنت. حاول مرة أخرى بعد قليل.", "حاول مرة أخرى"],
        fr: ["StockFlow est injoignable", "Le serveur du site est éteint, ou il n'y a pas d'internet. Réessayez dans un instant.", "Réessayer"],
      };
      try {
        var lang = localStorage.getItem("lang");
        if (texts[lang]) {
          document.documentElement.lang = lang;
          document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
          document.getElementById("title").textContent = texts[lang][0];
          document.getElementById("text").textContent = texts[lang][1];
          document.getElementById("retry").textContent = texts[lang][2];
        }
        var theme = localStorage.getItem("theme");
        if (theme === "dark" || (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.className = "dark";
      } catch (e) {}
    </script>
  </body>
</html>
